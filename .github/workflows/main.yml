name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile every Python file
        run: python -m py_compile *.py

      - name: Lint for undefined names and unused imports
        run: |
          pip install flake8
          flake8 --select=F *.py

      - name: Install JARVIS's packages (the ones that install on Linux)
        run: |
          grep -vE '^(rumps|pyobjc)' requirements-mac.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Import every module
        run: |
          for f in *.py; do
            echo "import ${f%.py}"
            timeout 60 python -c "import ${f%.py}"
          done

      - name: Run the tests
        run: python -m unittest -v

      - name: Check the shell scripts
        run: for f in setup_mac.sh add_speech.sh "Start JARVIS.command"; do bash -n "$f"; done
