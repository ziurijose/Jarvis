name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  folders-match:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the Mac and Windows folders share identical files
        run: python3 sync_folders.py --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: Mac
            requirements: requirements-mac.txt
            linux_skips: '^(rumps|pyobjc)'
          - folder: Windows
            requirements: requirements-windows.txt
            linux_skips: '^(pycaw|winrt)'
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile every Python file
        run: python -m py_compile *.py

      - name: Lint for undefined names and unused imports
        run: |
          pip install flake8
          flake8 --select=F *.py

      - name: Install JARVIS's packages (the ones that install on Linux)
        run: |
          grep -vE '${{ matrix.linux_skips }}' ${{ matrix.requirements }} > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Import every module
        run: |
          for f in *.py; do
            echo "import ${f%.py}"
            timeout 60 python -c "import ${f%.py}"
          done

      - name: Run the tests
        run: python -m unittest -v

      - name: Check the shell scripts
        if: matrix.folder == 'Mac'
        run: for f in setup_mac.sh add_speech.sh "Start JARVIS.command"; do bash -n "$f"; done
