name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile every Python file
        run: python -m py_compile *.py

      - name: Lint for undefined names and unused imports
        run: |
          pip install flake8
          flake8 --select=F *.py

      - name: Install JARVIS's packages (the ones that install on Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk libportaudio2
          grep -vE '^(rumps|pyobjc)' requirements-mac.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Import every module
        run: |
          for f in *.py; do
            echo "import ${f%.py}"
            python -c "import ${f%.py}"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the Apps Script and web page parse
        run: |
          cp Code.gs /tmp/Code.js && node --check /tmp/Code.js
          python - <<'PY'
          import re
          html = open('Index.html', encoding='utf-8').read()
          open('/tmp/Index.js', 'w').write('\n;\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)))
          PY
          node --check /tmp/Index.js

      - name: Check the shell scripts
        run: for f in setup_mac.sh add_speech.sh "Start JARVIS.command"; do bash -n "$f"; done
